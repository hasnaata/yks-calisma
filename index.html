<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/stil.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="assets/uygulama.js"></script>
<title>YKS Çalışma Sistemi</title></head><body>
<main>
<h1>YKS Çalışma Sistemi</h1>
<p class="soluk">TYT ve AYT Eşit Ağırlık için konu anlatımı, alıştırma ve aralıklı tekrar. Müfredat MEBİ ile birebir aynı sırada.</p>
<div class="sayac ui" id="sayac"></div>
<div id="tekrar"></div>
<div id="dersler"></div>
</main>
<script>
ustCubuk();
(async () => {
  const gun = Math.ceil((SINAV_TARIHI - new Date()) / 864e5);
  $('#sayac').innerHTML = `<span><b>${gun}</b> gün kaldı</span><span class="soluk">TYT 19 Haziran 2027 · AYT 20 Haziran 2027</span>`;
  const m = await mufredat(), il = Ilerleme.hepsi(), t = bugun();
  const tum = m.flatMap(altKonular);
  const vadesi = tum.filter(a => il[a.yol]?.sonraki && il[a.yol].sonraki <= t);
  if (vadesi.length) $('#tekrar').innerHTML = `<h2>Bugün tekrar et (${vadesi.length})</h2>
    <p class="soluk kucuk">Unutmaya başladığın anda hatırlamak, bilgiyi kalıcı yapar. Önce bunları bitir.</p><div class="izgara">` +
    vadesi.slice(0, 12).map(a => `<a class="kart" href="konu.html?y=${a.yol}&t=alistirma"><div class="ad">${a.ad}</div>
      <div class="alt">${a.ders.sinav} ${a.ders.ad} · son puan ${il[a.yol].puan}/${il[a.yol].toplam}</div></a>`).join('') + '</div>';
  let h = '';
  for (const sinav of ['TYT', 'AYT']) {
    h += `<h2>${sinav}${sinav == 'AYT' ? ' · Eşit Ağırlık' : ''}</h2><div class="izgara">`;
    for (const d of m.filter(x => x.sinav == sinav)) {
      const a = altKonular(d), hz = a.filter(hazir).length, bitti = a.filter(x => il[x.yol]?.son).length;
      h += `<a class="kart" href="ders.html?d=${d.id}"><div class="ad">${d.ad}</div>
        <div class="alt">${d.konular.length} konu · ${a.length} ders · ${hz} hazır</div>
        <div class="alt">Tamamladığın: ${bitti}/${a.length}</div>
        <div class="cubuk"><i style="width:${100 * bitti / a.length}%"></i></div></a>`;
    }
    h += '</div>';
  }
  $('#dersler').innerHTML = h;
})();
</script></body></html>
