<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/stil.css?v=2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="assets/uygulama.js?v=2"></script>
<title>Ders</title></head><body>
<main><div id="ic"></div></main>
<script>
ustCubuk();
(async () => {
  const id = new URLSearchParams(location.search).get('d');
  let m; try { m = await mufredat(); } catch { return yuklemeHatasi($('#ic')); }
  const d = m.find(x => x.id == id), il = Ilerleme.hepsi(), t = bugun();
  if (!d) { $('#ic').textContent = 'Ders bulunamadı.'; return; }
  document.title = d.sinav + ' ' + d.ad;
  let h = `<p class="kucuk ui"><a href="index.html">← Tüm dersler</a></p><h1>${d.sinav} ${d.ad}</h1>
    <p><a class="dugme" href="konu.html?karisik=${d.id}">Karışık tekrar testi</a>
    <span class="soluk kucuk"> Tamamladığın derslerden rastgele 10 soru.</span></p>`;
  for (const k of d.konular) {
    h += `<div class="konu"><h3>${k.no}. ${k.ad}</h3><ol>`;
    for (const a of k.altkonular) {
      const i = il[a.yol] || {};
      const rozet = !hazir(a) ? '<span class="rozet bekle">yakında</span>'
        : i.sonraki && i.sonraki <= t ? '<span class="rozet tekrar">tekrar zamanı</span>'
        : i.son ? `<span class="rozet tamam">${i.puan}/${i.toplam}</span>` : '<span class="rozet">hazır</span>';
      h += hazir(a) ? `<li><a class="ana" href="konu.html?y=${a.yol}">${a.ad}</a>${rozet}</li>`
        : `<li><span class="ana">${a.ad}</span>${rozet}
           <a class="kucuk dis" href="https://ogm-large-cdn.eba.gov.tr/mebi/pdf/${a.pdf}.pdf" target="_blank" rel="noopener">MEBİ özeti</a></li>`;
    }
    h += '</ol></div>';
  }
  $('#ic').innerHTML = h;
})();
</script></body></html>
